  <rect x="13.25" y="14" width="5.5" height="12" rx="1.6" fill="#ffffff" opacity="0.75"/>
  <rect x="20.5" y="8"  width="5.5" height="18" rx="1.6" fill="#ffffff"/>
</svg>
